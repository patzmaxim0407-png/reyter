      <h2 class="pinfo__name" id="pmName"></h2>

      <div class="pinfo__meta">
        <span class="status-chip" id="pmStatus"></span>
        <span class="pinfo__article" id="pmArticle"></span>
      </div>

      <div class="pinfo__price" id="pmPrice"></div>
      <p class="pinfo__sale-note" id="pmSaleNote" hidden></p>

      <div class="pinfo__colors" id="pmColorsBlock" hidden>
        <span class="pinfo__colors-title" data-i18n="p.color"></span>
        <div class="swatches" id="pmColors"></div>
      </div>

      <div class="pinfo__sizes" id="pmSizesBlock">
        <div class="pinfo__sizes-head">
          <span id="pmSizesTitle"></span>
          <button type="button" id="pmSizeLink" aria-expanded="false" aria-controls="pmSizeChart" data-i18n="p.sizeHelp"></button>
        </div>
        <div class="sizes" id="pmSizes"></div>
        <div class="pinfo__sizechart" id="pmSizeChart" hidden></div>
      </div>

      <div class="pinfo__eta" id="pmEta" hidden>
        <p class="pinfo__eta-text" id="pmEtaText"></p>
        <form class="pinfo__eta-form" id="pmEtaForm">
          <input type="email" id="pmEtaEmail" autocomplete="email"
                 data-i18n-attr="placeholder:eta.emailPh" placeholder="you@example.com">
          <button class="btn btn--ghost btn--sm" type="submit" data-i18n="eta.notify">Повідомити, коли зʼявиться</button>
        </form>
        <p class="pinfo__eta-done" id="pmEtaDone" hidden></p>
      </div>

      <div class="pinfo__cta">
        <span class="pinfo__cta-price" id="pmCtaPrice" aria-hidden="true"></span>
        <button class="btn btn--primary btn--order" id="pmAddCart" type="button">
          <svg class="ico-cart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M6 8h12l-1 13H7L6 8Z"/><path d="M9 10V6a3 3 0 0 1 6 0v4"/></svg>
          <svg class="ico-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="m4.5 12.5 5 5 10-11"/></svg>
          <span id="pmAddCartLabel"></span>
        </button>

        <div class="pinfo__incart" id="pmInCart" hidden>
          <span class="qty qty--lg">
            <button type="button" data-pm-minus aria-label="−">−</button>
            <span id="pmQtyValue">1</span>
            <button type="button" data-pm-plus aria-label="+">+</button>
          </span>
          <button class="btn btn--ghost" type="button" id="pmGoCart" data-i18n="p.goToCart"></button>
        </div>
      </div>

      <div class="pinfo__desc" id="pmDesc"></div>
      <div class="pinfo__extras" id="pmExtras"></div>

      <div class="pinfo__notes">
        <div class="note-card" data-i18n="p.note1"></div>
        <div class="note-card" data-i18n="p.note2"></div>
        <div class="note-card" data-i18n="p.note3"></div>
      </div>
    </div>
    </div>
  </div>
</div>

<!-- Лайтбокс -->
<div class="lightbox" id="lightbox" hidden>
  <button class="lightbox__close" id="lbClose" data-i18n-attr="aria-label:p.close">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
  </button>
  <button class="lightbox__nav lightbox__nav--prev" id="lbPrev" data-i18n-attr="aria-label:p.prev">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg>
  </button>
  <button class="lightbox__nav lightbox__nav--next" id="lbNext" data-i18n-attr="aria-label:p.next">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
  </button>
  <div class="lightbox__stage" id="lbStage">
    <img id="lbImage" src="" alt="">
  </div>
  <span class="lightbox__counter" id="lbCounter"></span>
</div>

<!-- Діалог Friendly Club -->
<div class="fc-dialog" id="fcDialog" role="dialog" aria-modal="true" aria-labelledby="fcTitle" hidden>
  <div class="fc-dialog__backdrop" data-close></div>
  <div class="fc-dialog__panel">
    <button class="fc-dialog__close" data-close data-i18n-attr="aria-label:p.close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
    <h3 class="fc-dialog__title" id="fcTitle" data-i18n="fclub.title"></h3>
    <p data-i18n="fclub.p1"></p>
    <p data-i18n="fclub.p2"></p>
    <p data-i18n="fclub.p3"></p>
    <h4 data-i18n="fclub.h2"></h4>
    <p data-i18n="fclub.p4"></p>
    <ul>
      <li data-i18n="fclub.li1"></li>
      <li data-i18n="fclub.li2"></li>
      <li data-i18n="fclub.li3"></li>
      <li data-i18n="fclub.li4"></li>
    </ul>
    <p class="fc-dialog__note" data-i18n="fclub.note"></p>
  </div>
</div>

<!-- Кошик -->
<div class="drawer" id="cartDrawer" role="dialog" aria-modal="true" aria-labelledby="cartTitle" hidden>
  <div class="drawer__backdrop" data-close></div>
  <aside class="drawer__panel">
    <header class="drawer__head">
      <h3 class="drawer__title" id="cartTitle" data-i18n="cart.title"></h3>
      <button class="drawer__close" data-close data-i18n-attr="aria-label:p.close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </header>
    <div class="drawer__body" id="cartBody"></div>
    <footer class="drawer__foot" id="cartFoot"></footer>
  </aside>
</div>

<!-- Кабінет користувача -->
<div class="drawer drawer--account" id="accountDrawer" role="dialog" aria-modal="true" aria-labelledby="accountTitle" hidden>
  <div class="drawer__backdrop" data-close></div>
  <aside class="drawer__panel">
    <header class="drawer__head">
      <h3 class="drawer__title" id="accountTitle" data-i18n="acc.title"></h3>
      <button class="drawer__close" data-close data-i18n-attr="aria-label:p.close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </header>
    <div class="drawer__tabs" role="tablist" aria-label="REYTER">
      <button class="drawer__tab is-active" id="tabProfile" role="tab" aria-selected="true" data-tab="profile" data-i18n="acc.profile"></button>
      <button class="drawer__tab" id="tabPromos" role="tab" aria-selected="false" data-tab="promos" data-i18n="acc.myPromos"></button>
      <button class="drawer__tab" id="tabOrders" role="tab" aria-selected="false" data-tab="orders" data-i18n="acc.orders"></button>
    </div>
    <div class="drawer__body" id="accountBody"></div>
  </aside>
</div>

<!-- Сповіщення -->
<div class="toasts" id="toasts" aria-live="polite"></div>
